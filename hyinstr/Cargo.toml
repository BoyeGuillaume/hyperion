[package]
name = "hyinstr"
version = "0.1.3"
edition = "2024"

[dependencies]
uuid = { workspace = true, features = ["v4", "v6", "v8", "v7"] }
strum = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"], optional = true }
parking_lot = { workspace = true, features = ["deadlock_detection"] }
bigdecimal.workspace = true
num-bigint.workspace = true
smallvec.workspace = true
log.workspace = true
auto_enums.workspace = true
thiserror.workspace = true
petgraph.workspace = true
either.workspace = true
enum-map.workspace = true
bitflags.workspace = true
chumsky = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
slotmap = { workspace = true }
bevy_reflect = { workspace = true, features = [
    "uuid",
    "debug",
    "indexmap",
    "smallvec",
    "auto_register_inventory",
    "auto_register",
    "petgraph",
    "functions",
    "hashbrown",
    "reflect_documentation",
], default-features = true, optional = true }

[features]
default = ["chumsky", "chumsky/either"]
serde = [
    "dep:serde",
    "serde/serde_derive",
    "serde/rc",
    "uuid/serde",
    "num-bigint/serde",
    "bigdecimal/serde",
    "petgraph/serde",
    "bitflags/serde",
]
chumsky = ["dep:chumsky"]
borsh = ["dep:borsh", "borsh/derive", "borsh/rc", "uuid/borsh"]
reflect = ["bevy_reflect"]
